name: demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        if: matrix.os != 'ubuntu-latest'
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Install package, test, and ONNX Runtime edge dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install --upgrade pip && pip install -e ".[dev,edge]"
      - name: Run unit tests
        env:
          LAB_FEET_REQUIRE_ORT: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: pytest -q
      - name: Run distillation & quantization benchmark with threshold gates
        run: |
          python demo/distill_quantize.py --assert-thresholds --json-out reports/benchmark.json --export-bin reports/student_4bit.lft1
          lab-feet inspect-binary reports/student_4bit.lft1
