[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-feet"
version = "0.2.0"
description = "Edge knowledge distillation (KL + T^2 scaling), int8/4-bit post-training quantization, W8A8 integer matmul, and binary serialization for Auto-Lab L0."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Yani Guan" }]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
]
edge = [
    "onnxruntime>=1.19",
]

[project.scripts]
lab-feet = "lab_feet.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
